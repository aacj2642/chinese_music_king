<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 背景深邃金韻漸層 -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#252d42" />
      <stop offset="100%" stop-color="#0c0e14" />
    </radialGradient>

    <!-- 皇冠與金邊漸層 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b8" />
      <stop offset="45%" stop-color="#e5b95f" />
      <stop offset="100%" stop-color="#b67d22" />
    </linearGradient>

    <!-- 琵琶琴身暖木漸層 -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e09145" />
      <stop offset="100%" stop-color="#9c4623" />
    </linearGradient>

    <!-- 琵琶面板柔光漸層 -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e7" />
      <stop offset="100%" stop-color="#f7dca6" />
    </linearGradient>

    <!-- 國風朱紅耳機漸層 -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- 圓角徽章底板 -->
  <rect
    x="2.5"
    y="2.5"
    width="59"
    height="59"
    rx="15"
    fill="url(#bgGrad)"
    stroke="url(#goldGrad)"
    stroke-width="2.5"
  />

  <!-- 背光柔和金暈 -->
  <circle cx="32" cy="37" r="21" fill="#e5b95f" opacity="0.1" />

  <!-- 盲聽耳機頭帶 -->
  <path
    d="M 13.5 37 C 13.5 21, 50.5 21, 50.5 37"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="2.8"
    stroke-linecap="round"
  />

  <!-- 左側耳機罩 -->
  <rect
    x="8.5"
    y="31.5"
    width="7.5"
    height="13.5"
    rx="3.75"
    fill="url(#redGrad)"
    stroke="#f3ce7a"
    stroke-width="1.2"
  />
  <rect x="14" y="33.5" width="3.2" height="9.5" rx="1.6" fill="#e5b95f" />

  <!-- 右側耳機罩 -->
  <rect
    x="48"
    y="31.5"
    width="7.5"
    height="13.5"
    rx="3.75"
    fill="url(#redGrad)"
    stroke="#f3ce7a"
    stroke-width="1.2"
  />
  <rect x="46.8" y="33.5" width="3.2" height="9.5" rx="1.6" fill="#e5b95f" />

  <!-- 琵琶琴軫（左右各二） -->
  <rect x="23.5" y="16" width="5.5" height="2.2" rx="1.1" fill="#e5b95f" />
  <rect x="24.2" y="19.8" width="4.8" height="2.2" rx="1.1" fill="#e5b95f" />
  <rect x="35" y="16" width="5.5" height="2.2" rx="1.1" fill="#e5b95f" />
  <rect x="35" y="19.8" width="4.8" height="2.2" rx="1.1" fill="#e5b95f" />

  <!-- 琵琶琴頸 -->
  <rect
    x="28.6"
    y="13.5"
    width="6.8"
    height="14"
    rx="2"
    fill="#7c3718"
    stroke="#f3ce7a"
    stroke-width="1.1"
  />

  <!-- 圓潤琵琶外框 -->
  <path
    d="M 32 22.5 C 41.2 22.5, 47.8 31.2, 47.8 40.8 C 47.8 50, 41 55.5, 32 55.5 C 23 55.5, 16.2 50, 16.2 40.8 C 16.2 31.2, 22.8 22.5, 32 22.5 Z"
    fill="url(#woodGrad)"
    stroke="#f3ce7a"
    stroke-width="1.5"
  />

  <!-- 琵琶可愛面板（肚子） -->
  <path
    d="M 32 25 C 39.6 25, 45 32.5, 45 40.8 C 45 48.3, 39.4 53, 32 53 C 24.6 53, 19 48.3, 19 40.8 C 19 32.5, 24.4 25, 32 25 Z"
    fill="url(#faceGrad)"
  />

  <!-- 琴頸相品與上段琴弦 -->
  <line x1="29.5" y1="24.5" x2="34.5" y2="24.5" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" />
  <line x1="29" y1="27.2" x2="35" y2="27.2" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" />
  <line x1="28.5" y1="29.9" x2="35.5" y2="29.9" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" />

  <!-- 底部覆手與琴弦尾端 -->
  <line x1="29.5" y1="45.2" x2="29.5" y2="48.5" stroke="#d97706" stroke-width="0.9" opacity="0.65" />
  <line x1="31.2" y1="45.2" x2="31.2" y2="48.5" stroke="#d97706" stroke-width="0.9" opacity="0.65" />
  <line x1="32.8" y1="45.2" x2="32.8" y2="48.5" stroke="#d97706" stroke-width="0.9" opacity="0.65" />
  <line x1="34.5" y1="45.2" x2="34.5" y2="48.5" stroke="#d97706" stroke-width="0.9" opacity="0.65" />
  <rect
    x="26.5"
    y="48"
    width="11"
    height="2.6"
    rx="1.3"
    fill="#7c3718"
    stroke="#e5b95f"
    stroke-width="0.8"
  />

  <!-- 可愛表情：水汪汪大眼睛 -->
  <circle cx="25.5" cy="38.2" r="2.8" fill="#231815" />
  <circle cx="24.6" cy="37.2" r="1.15" fill="#ffffff" />
  <circle cx="26.4" cy="39.1" r="0.55" fill="#ffffff" />

  <circle cx="38.5" cy="38.2" r="2.8" fill="#231815" />
  <circle cx="37.6" cy="37.2" r="1.15" fill="#ffffff" />
  <circle cx="39.4" cy="39.1" r="0.55" fill="#ffffff" />

  <!-- 粉嫩腮紅 -->
  <ellipse cx="21.8" cy="41.3" rx="2.6" ry="1.5" fill="#ff758f" opacity="0.68" />
  <ellipse cx="42.2" cy="41.3" rx="2.6" ry="1.5" fill="#ff758f" opacity="0.68" />

  <!-- 開心微笑貓嘴 -->
  <path
    d="M 29.3 40.8 Q 30.65 42.7 32 41.2 Q 33.35 42.7 34.7 40.8"
    fill="none"
    stroke="#6e351c"
    stroke-width="1.55"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 王者皇冠（國樂之王） -->
  <path
    d="M 24 14.5 L 22.2 7.8 L 27.5 11.2 L 32 5.5 L 36.5 11.2 L 41.8 7.8 L 40 14.5 Z"
    fill="url(#goldGrad)"
    stroke="#fff8dc"
    stroke-width="1"
    stroke-linejoin="round"
  />
  <circle cx="22.2" cy="7.2" r="1.2" fill="#fff8dc" />
  <circle cx="32" cy="4.9" r="1.45" fill="#fff8dc" />
  <circle cx="41.8" cy="7.2" r="1.2" fill="#fff8dc" />
  <circle cx="32" cy="11.6" r="1.5" fill="#e11d48" stroke="#fff8dc" stroke-width="0.6" />

  <!-- 飄浮金色音符與星光 -->
  <path
    d="M 12.5 21.5 L 12.5 14.5 L 17.8 13 L 17.8 15.2 L 14.2 16.2 L 14.2 21.5 C 14.2 22.9, 12.7 23.8, 11.2 23.4 C 9.9 23, 9.6 21.6, 10.6 20.7 C 11.2 20.2, 11.9 20.3, 12.5 20.6 Z"
    fill="#f3ce7a"
  />
  <path
    d="M 51.2 13.5 L 52.3 16.6 L 55.4 17.7 L 52.3 18.8 L 51.2 21.9 L 50.1 18.8 L 47 17.7 L 50.1 16.6 Z"
    fill="#f3ce7a"
  />
</svg>

