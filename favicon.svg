<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 黑曜石深邃背景漸層 -->
    <radialGradient id="bgGrad" cx="42%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#1e2639" />
      <stop offset="100%" stop-color="#0b0e14" />
    </radialGradient>

    <!-- 皇室鎏金漸層 -->
    <linearGradient id="goldGrad" x1="10%" y1="6%" x2="90%" y2="94%">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="48%" stop-color="#e5b95f" />
      <stop offset="100%" stop-color="#b47b22" />
    </linearGradient>

    <!-- 古箏岳山與琴弦鏤空遮罩 -->
    <mask id="guzhengCut">
      <rect width="64" height="64" fill="#ffffff" />
      <path
        d="M 16.5 34.4 C 19.0 39.8, 20.4 45.4, 20.4 51.0"
        fill="none"
        stroke="#000000"
        stroke-width="1.5"
        stroke-linecap="round"
      />
      <line x1="18.2" y1="37.0" x2="49.2" y2="26.2" stroke="#000000" stroke-width="1.25" stroke-linecap="round" />
      <line x1="19.2" y1="41.2" x2="50.0" y2="28.3" stroke="#000000" stroke-width="1.25" stroke-linecap="round" />
      <line x1="20.2" y1="45.6" x2="50.8" y2="30.4" stroke="#000000" stroke-width="1.25" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- 圓角黑曜石徽章底板 -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="15"
    fill="url(#bgGrad)"
    stroke="url(#goldGrad)"
    stroke-width="1.35"
    stroke-opacity="0.52"
  />

  <!-- 斜向透視金雕古箏琴身 -->
  <path
    d="M 11.8 36.2 C 11.2 34.4, 12.6 33.0, 14.8 32.4 L 49.5 23.4 C 52.6 22.8, 54.4 26.8, 53.6 30.8 C 53.2 32.5, 52.0 33.4, 50.4 34.2 L 21.4 51.4 C 19.2 52.6, 17.2 52.0, 15.8 50.0 C 13.0 46.0, 12.2 40.5, 11.8 36.2 Z"
    fill="url(#goldGrad)"
    mask="url(#guzhengCut)"
  />

  <!-- 跨弦斜飛雁柱（箏碼） -->
  <polygon points="24.2,46.0 24.4,40.4 28.4,43.8" fill="#fff8de" />
  <polygon points="32.2,38.4 32.6,33.2 36.0,36.6" fill="#fff8de" />
  <polygon points="39.8,31.6 40.2,26.8 43.2,29.8" fill="#fff8de" />

  <!-- 極簡三峰王冠 -->
  <path
    d="M 13.2 24.2 L 11.2 16.8 L 16.6 20.0 L 20.5 13.6 L 24.4 20.0 L 29.8 16.8 L 27.8 24.2 Z"
    fill="url(#goldGrad)"
    stroke="url(#goldGrad)"
    stroke-width="1"
    stroke-linejoin="round"
    transform="rotate(-17 20.5 19)"
  />
</svg>
